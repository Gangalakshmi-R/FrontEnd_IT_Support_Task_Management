name: Build
'on':
  push:
    branches:
      - '*'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17
      - name: Move Pom.xml to Root
        run: mv .github/workflows/pom.xml ./pom.xml
      - name: Build and analyze
        env:
          GITHUB_TOKEN: >-
            3c59354e-96c0-47a7-a3a4-6b089fe44b7f-a7c8b264-7fc9-412f-8a64-cb8730ebbd35
          SONAR_TOKEN: sqa_bca47d55147cb1b256a213a17c135dfe863be411
        run: >-
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=iamneo-production-4_3c59354e-96c0-47a7-a3a4-6b089fe44b7f-a7c8b264-7fc9-412f-8a64-cb8730ebbd35
          -Dsonar.login=sqa_bca47d55147cb1b256a213a17c135dfe863be411
     
